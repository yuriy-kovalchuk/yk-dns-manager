# Sample HTTPRoute for local testing. The controller manages a DNS record for
# every hostname here that matches the domain map, so this one produces
# app.example.com -> 10.0.0.1.
#
# Apply it with:
#   kubectl --context kind-yk-dns-manager-dev apply -f hack/local/httproute.yaml
# and read the result back from the fake with:
#   curl -s localhost:8053/records
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: local-demo
  namespace: default
spec:
  hostnames:
    - app.example.com
  rules:
    - backendRefs:
        - name: local-demo
          port: 80
