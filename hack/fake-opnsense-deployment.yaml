# In-cluster OPNsense fake for local development. Deploy it with
# `make kind-fake-install`, which builds the image, loads it into the kind node
# and applies this file. Point the controller at it with
# http://fake-opnsense.<namespace>.svc.cluster.local:8053/api.
#
# State is in memory only and is lost when the pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-opnsense
  labels:
    app.kubernetes.io/name: fake-opnsense
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-opnsense
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-opnsense
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fake-opnsense
          image: fake-opnsense:local
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8053
          ports:
            - name: api
              containerPort: 8053
          readinessProbe:
            httpGet:
              path: /records
              port: api
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: fake-opnsense
  labels:
    app.kubernetes.io/name: fake-opnsense
spec:
  selector:
    app.kubernetes.io/name: fake-opnsense
  ports:
    - name: api
      port: 8053
      targetPort: api
