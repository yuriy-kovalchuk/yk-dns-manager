# Helm overrides for the kind cluster that `make kind-deploy` creates.

image:
  tag: local
  pullPolicy: Never  # image is loaded directly into kind via `make kind-load`

logLevel: debug

domainMap:
  example.com: 10.0.0.1

dnsProvider:
  provider: opnsense
  upsert: true
  settings:
    # `make kind-fake-install` runs the in-memory fake inside the cluster. A pod
    # cannot reach the host's 127.0.0.1, so use the Service DNS name.
    base_url: "http://fake-opnsense.yk-dns-manager-system.svc.cluster.local:8053/api"
    api_key: "${OPNSENSE_API_KEY}"
    api_secret: "${OPNSENSE_API_SECRET}"
    default_ttl: "60"
  existingSecret: yk-dns-manager-credentials
  # Against a real appliance with a self-signed certificate, put its CA in a
  # ConfigMap under the key ca.pem, name that ConfigMap here, and add
  # ca_file: "/etc/yk-dns-manager/ca/ca.pem" to settings above. Never set
  # skip_tls_verify: true, not even locally — the credentials go out on every
  # request.
  # caConfigMap: opnsense-ca

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 32Mi
