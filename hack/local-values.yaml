# Helm overrides for the kind cluster that `make kind-deploy` creates.

image:
  tag: local
  pullPolicy: Never  # image is loaded directly into kind via `make kind-load`

logLevel: debug

domainMap:
  example.com: 10.0.0.1

dnsProvider:
  provider: opnsense
  upsert: true
  settings:
    # The in-memory fake that `make kind-fake-install` runs in the release
    # namespace. It speaks plain HTTP and accepts any credentials.
    base_url: "http://fake-opnsense.yk-dns-manager-system.svc.cluster.local:8053/api"
    # The fake speaks plain HTTP. Never set this for a real appliance.
    allow_insecure_http: "true"
    api_key: "${OPNSENSE_API_KEY}"
    api_secret: "${OPNSENSE_API_SECRET}"
    default_ttl: "60"
    # To deploy against a real appliance instead, drop the kind-fake-install
    # prerequisite of kind-deploy and use:
    #   base_url: "https://<appliance>/api"
    #   ca_file: "/etc/yk-dns-manager/ca/ca.pem"
    # with the appliance CA in a ConfigMap under the key ca.pem, named in
    # caConfigMap below. Never set skip_tls_verify: true, not even locally —
    # the credentials go out on every request.
  existingSecret: yk-dns-manager-credentials
  # caConfigMap: opnsense-ca

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 32Mi
