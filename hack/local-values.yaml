# Helm overrides for the kind cluster that `make kind-deploy` creates.

image:
  tag: local
  pullPolicy: Never  # image is loaded directly into kind via `make kind-load`

logLevel: debug

domainMap:
  "*.example.com": 10.0.0.1

dnsProvider:
  # Records live in the controller's memory and show up in `make kind-logs`.
  provider: memory
  upsert: true
  # Drop the chart's OPNsense defaults: the memory provider rejects them.
  settings:
    base_url: null
    skip_tls_verify: null
    ca_file: null
    api_key: null
    api_secret: null
  # To deploy against a real appliance instead, set provider: opnsense, keep
  # the default settings and add:
  #   base_url: "https://<appliance>/api"
  #   ca_file: "/etc/yk-dns-manager/ca/ca.pem"
  # with the appliance CA in a ConfigMap under the key ca.pem, named in
  # caConfigMap, and `make kind-secret` before deploying with
  #   existingSecret: yk-dns-manager-credentials
  # Never set skip_tls_verify: true, not even locally — the credentials go out
  # on every request.

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 32Mi
