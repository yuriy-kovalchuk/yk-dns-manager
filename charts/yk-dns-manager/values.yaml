# Default values for yk-dns-manager.
# This is a YAML-formatted file.
nameOverride: ""
fullnameOverride: ""

image:
  # -- Image repository for the controller container.
  repository: ghcr.io/yuriy-kovalchuk/yk-dns-manager
  # -- Image tag, defaults to `.Chart.AppVersion` if not set.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# -- Log level for the controller. Valid values are 'info' or 'debug'.
logLevel: info

strategy:
  type: Recreate

revisionHistoryLimit: 3

serviceAccount:
  # -- If true, create a new ServiceAccount.
  create: true
  # -- If set, use this name for the ServiceAccount.
  name: ""
  # -- Automount API credentials for the ServiceAccount.
  # Must be true — this is a Kubernetes controller that needs API access
  # to watch HTTPRoutes and update finalizers/annotations.
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

priorityClassName: ""

# -- Domain-to-IP mapping. The controller uses this to resolve which IP
# a DNS record should point to when an HTTPRoute hostname matches.
# Example:
#   "*.example.com": "10.0.0.1"
#   "special.example.com": "10.0.0.2"
domainMap:
  "example.com": "10.0.0.1"

# -- DNS provider instances. Every configured instance is an independent
# backend that receives every managed record (broadcast).
# Empty by default: the controller runs in no-op mode (HTTPRoutes are
# watched but no DNS records are managed) until at least one instance
# is configured. The map key is the instance name; `provider` selects
# the type and defaults to the instance name.
dnsProviders: {}

# -- Namespace the app reads provider credential Secrets from. Empty = the
# app's own (release) namespace, which is the normal case. Set this only
# when running locally against a dev cluster, or to read Secrets from a
# different namespace (you must grant access there with your own RBAC).
secretsNamespace: ""

# Example instance (uncomment and adapt). The app reads the named Secret
# from the cluster at startup; the opnsense provider expects it to contain
# the keys API_KEY and API_SECRET.
# dnsProviders:
#   opnsense:
#     # -- Provider type (e.g. "opnsense"). Defaults to the instance name.
#     provider: "opnsense"
#     # -- If true, update existing records on every reconcile for this
#     # instance. If false, only create records that don't already exist.
#     upsert: false
#     # -- Non-secret connection settings only. Credentials are NOT written
#     # here — they live in the Secret named below.
#     settings:
#       base_url: "https://opnsense.example.com/api"
#       skip_tls_verify: "false"
#     # -- Name of the existing Secret in the cluster holding this instance's
#     # credentials. The chart grants get access to exactly this name.
#     secret: "opnsense-creds"

metrics:
  service:
    # -- Metrics endpoint port.
    port: 9090

serviceMonitor:
  # -- If true, create a Prometheus ServiceMonitor resource.
  enabled: false
  # -- Scrape interval.
  interval: 30s
  # -- Namespace for the ServiceMonitor. Defaults to the release namespace.
  namespace: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 5

# -- Container resource requests and limits.
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
