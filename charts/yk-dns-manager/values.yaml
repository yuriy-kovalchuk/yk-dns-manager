# Default values for yk-dns-manager.
# This is a YAML-formatted file.
nameOverride: ""
fullnameOverride: ""

image:
  # -- Image repository for the controller container.
  repository: ghcr.io/yuriy-kovalchuk/yk-dns-manager
  # -- Image tag, defaults to `.Chart.AppVersion` if not set.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Replicas. More than one needs leaderElection.enabled; only the leader
# manages DNS, the others stand by.
replicaCount: 1

leaderElection:
  # -- Elect a leader through a Lease in the release namespace, so only one
  # replica manages DNS at a time. Keep it on unless you are sure only one pod
  # can ever run, which a RollingUpdate does not guarantee.
  enabled: true

# -- Log level for the controller: debug, info, warn, error, or a numeric logr
# verbosity such as -3 for V(3).
logLevel: info

# -- Only publish DNS for HTTPRoutes that at least one parent Gateway has
# accepted (status.parents[].conditions Accepted=True). Off, any HTTPRoute
# with a hostname the domain map covers gets DNS, including one no Gateway
# admitted, so anyone who can create an HTTPRoute can claim a name.
requireAcceptedRoutes: false

# -- How often every HTTPRoute is reconciled again even when nothing changed in
# the cluster. This is what republishes a DNS record someone changed or deleted
# on the DNS backend. Set to 0 to turn it off.
resyncPeriod: 1h

# -- Deployment strategy. Recreate stops the old pod before starting the new
# one. With leader election on, RollingUpdate is safe too; set
# strategy.rollingUpdate to tune it, or leave it out for Kubernetes' defaults
# (maxSurge and maxUnavailable 25%).
strategy:
  type: Recreate

revisionHistoryLimit: 3

serviceAccount:
  # -- If true, create a new ServiceAccount.
  create: true
  # -- If set, use this name for the ServiceAccount.
  name: ""
  # -- Automount API credentials for the ServiceAccount.
  # Must be true — this is a Kubernetes controller that needs API access
  # to watch HTTPRoutes and update finalizers/annotations.
  automountServiceAccountToken: true

podAnnotations: {}
podLabels: {}

priorityClassName: ""

# -- Domain-to-IP mapping: which IP the DNS record of a matching HTTPRoute
# hostname points to. A "*.example.com" key covers every name below
# example.com, at any depth; an exact key such as "example.com" covers only
# that one name. An exact key wins, then the most specific wildcard.
# Example:
#   "*.example.com": "10.0.0.1"
#   "special.example.com": "10.0.0.2"
domainMap:
  "*.example.com": "10.0.0.1"

# -- DNS provider configuration. The controller will not manage any DNS
# records until a provider is configured.
dnsProvider:
  # -- Provider name (e.g. "opnsense"). Must match a registered provider.
  provider: "opnsense"
  # -- If true, also correct a managed record that holds a different IP.
  # If false, only create records that don't already exist.
  upsert: false
  # -- Provider-specific connection settings. Each provider defines its own keys.
  settings:
    base_url: "https://opnsense.example.com/api"
    # -- Disables TLS certificate verification. Keep this false: the API key and
    # secret go out on every request, so an unverified TLS connection hands them
    # to anyone who answers on the network path. For a self-signed appliance, pin
    # its CA with ca_file below instead.
    skip_tls_verify: "false"
    # -- Path inside the pod to a PEM CA bundle that signed the appliance
    # certificate. Set it together with dnsProvider.caConfigMap, or mount your
    # own volume. Mutually exclusive with skip_tls_verify.
    ca_file: ""
    api_key: "${OPNSENSE_API_KEY}"
    api_secret: "${OPNSENSE_API_SECRET}"
  # -- Name of an existing Secret containing provider credentials.
  # The secret's data will be injected as environment variables, which
  # can be referenced in settings via ${ENV_VAR} syntax.
  existingSecret: ""
  # -- Name of an existing ConfigMap holding the appliance CA bundle under the
  # key ca.pem. It is mounted read-only at /etc/yk-dns-manager/ca, so set
  # settings.ca_file to /etc/yk-dns-manager/ca/ca.pem to use it.
  caConfigMap: ""

metrics:
  service:
    # -- Metrics endpoint port.
    port: 9090

networkPolicy:
  # -- Restrict pod traffic. Needs a CNI that enforces NetworkPolicy; on a
  # cluster without one the resource is accepted and silently ignored.
  enabled: false
  # -- from rules (podSelector / namespaceSelector / ipBlock) allowed to reach
  # /metrics. Empty means any source in the cluster, which is the same as having
  # no policy for that port.
  # Example:
  #   metricsIngress:
  #     - namespaceSelector:
  #         matchLabels:
  #           kubernetes.io/metadata.name: monitoring
  metricsIngress: []
  # -- Egress to the Kubernetes API server. Most CNIs (Calico, Cilium) evaluate
  # egress after the kubernetes Service is translated to its endpoint, so the
  # endpoint port has to be allowed, not just the Service port 443: kubeadm,
  # k3s and Talos serve on 6443. cidrs narrows the destination; empty means any.
  apiServer:
    ports: [443, 6443]
    cidrs: []
  # -- Egress to the DNS provider API. Set ports to the port in
  # dnsProvider.settings.base_url when the appliance does not serve on 443, and
  # cidrs to its address to keep the controller from reaching anything else.
  provider:
    ports: [443]
    cidrs: []

serviceMonitor:
  # -- If true, create a Prometheus ServiceMonitor resource.
  enabled: false
  # -- Scrape interval.
  interval: 30s
  # -- Namespace for the ServiceMonitor. Defaults to the release namespace.
  namespace: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 5

# -- Container resource requests and limits.
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
