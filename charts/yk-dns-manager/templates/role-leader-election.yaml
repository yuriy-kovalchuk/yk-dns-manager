{{- if .Values.leaderElection.enabled }}
# Leader election: a Lease in the release namespace, and the Events
# controller-runtime records when leadership changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yk-dns-manager.fullname" . }}-leader-election
  labels:
    {{- include "yk-dns-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yk-dns-manager.fullname" . }}-leader-election
  labels:
    {{- include "yk-dns-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "yk-dns-manager.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "yk-dns-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
