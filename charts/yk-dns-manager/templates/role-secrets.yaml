{{- /*
Namespace-scoped permission to read the credential Secrets referenced by
provider instances. Rendered only when at least one instance sets 'secret';
access is restricted via resourceNames to exactly those Secret names.

The Secrets are expected in the release namespace by default (the app reads
them from its own namespace in-cluster). Point 'secretsNamespace' at another
namespace and grant access there with your own RBAC — this Role only covers
the release namespace.
*/}}
{{- $secretNames := list }}
{{- range .Values.dnsProviders }}
{{- if .secret }}
{{- $secretNames = append $secretNames .secret }}
{{- end }}
{{- end }}
{{- with $secretNames | uniq }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "yk-dns-manager.fullname" $ }}-secrets
  labels:
    {{- include "yk-dns-manager.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range . }}
      - {{ . }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yk-dns-manager.fullname" $ }}-secrets
  labels:
    {{- include "yk-dns-manager.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "yk-dns-manager.fullname" $ }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "yk-dns-manager.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
