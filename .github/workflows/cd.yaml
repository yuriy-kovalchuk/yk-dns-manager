name: CD

# A `v*` tag is the release trigger and the version. This workflow runs the
# same checks as CI on the tagged commit, refuses a tag that is not on master,
# then builds and publishes the release image and the Helm chart and turns the
# tag into a GitHub Release. `:latest` is only ever moved here, never by a
# master push.

on:
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  # Artifact registry: GHCR serves both the docker image and the helm chart
  # (pushed as an OCI artifact), so one login covers both. Auth uses the
  # workflow's own GITHUB_TOKEN — no repo secrets to configure.
  REGISTRY:    ghcr.io
  IMAGE:       ghcr.io/yuriy-kovalchuk/yk-dns-manager
  CHART_NAME:  yk-dns-manager
  CHART_DIR:   charts/yk-dns-manager

jobs:
  # Nothing is published unless the tagged commit passes the same checks a PR
  # has to. A tag can point at any commit, including one that never went
  # through CI.
  checks:
    uses: ./.github/workflows/checks.yaml

  publish:
    name: Publish image + helm chart
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for version stamping

      - name: Require the tagged commit to be on master
        # Releases come from reviewed history only. A tag on a side branch or
        # a local-only commit would otherwise ship as :latest.
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master; refusing to publish"
            exit 1
          fi

      - name: Set up Buildx
        # No QEMU: every RUN is in the builder stage, which runs on the runner's own
        # platform and cross-compiles; the arm64 stage only copies the binary in.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and tags
        id: version
        # The tag keeps its v prefix for the git ref; image and chart versions drop
        # it, and appVersion == image tag so the chart helper's
        # `default .Chart.AppVersion .Values.image.tag` resolves without an override.
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "VERSION=${version}"
            echo 'TAGS<<EOF'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.version.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The chart is a release artifact: chart versions must be unique semver (there is
      # no "latest"), so the chart publishes only on tag pushes, and the tag is
      # the version. `helm package --version/--app-version` stamps the packaged
      # copy; the in-tree Chart.yaml stays a placeholder for local development.
      - name: Install helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Package helm chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" \
            --version "${{ steps.version.outputs.VERSION }}" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --destination dist
          echo "tgz=dist/${CHART_NAME}-${{ steps.version.outputs.VERSION }}.tgz" >> "$GITHUB_OUTPUT"
        id: helm-package

      - name: Publish helm chart (OCI artifact)
        # helm push authenticates through the docker config the login step
        # wrote, so no separate credentials are needed here.
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          helm push "${{ steps.helm-package.outputs.tgz }}" "oci://${REGISTRY}/${owner}/charts"
          echo "Pushed ${{ steps.helm-package.outputs.tgz }}"

      # A tag push builds and publishes artifacts but never touches the
      # Releases API on its own — this is the step that actually turns the
      # tag into a GitHub Release, with the packaged chart attached so it's
      # downloadable without an OCI-capable Helm.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          cat > notes.md <<EOF
          ## Docker image

          \`\`\`bash
          docker pull ${IMAGE}:${version}
          \`\`\`

          ## Helm chart

          \`\`\`bash
          helm install yk-dns-manager \\
            oci://ghcr.io/yuriy-kovalchuk/charts/yk-dns-manager \\
            --version ${version} \\
            --namespace yk-dns-manager-system --create-namespace
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file notes.md \
            "${{ steps.helm-package.outputs.tgz }}"
