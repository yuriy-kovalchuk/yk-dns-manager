name: CI

# CI runs checks on every push/PR. On a green push to master it additionally
# publishes the :master image (job below); releases — tagged image + helm chart
# — live in cd.yml on tag pushes, so :latest always means newest release.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  # Target of the publish job (master pushes only). GHCR auth uses the
  # workflow's own GITHUB_TOKEN — no repo secrets to configure.
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/yuriy-kovalchuk/yk-dns-manager

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  publish:
    name: Publish :master image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for git describe (VERSION)

      - name: Set up QEMU
        # Needed for the arm64 leg of the multi-platform build; the amd64 leg runs
        # natively. QEMU emulation is why this job is slower than the checks job.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and tags
        id: version
        run: |
          {
            echo "VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo master)"
            echo 'TAGS<<EOF'
            echo "${IMAGE}:master"
            echo "${IMAGE}:master-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.version.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
