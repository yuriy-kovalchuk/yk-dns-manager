name: Checks

# The checks every change and every release has to pass: format, vet, build,
# unit + envtest, lint, govulncheck, helm lint, and Trivy scans of the image and
# the repository. CI runs them on every push and PR; CD runs them on the release
# tag before anything is published. The scan jobs upload SARIF, so callers grant
# security-events: write.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Code checks + helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for git describe in `make build`

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the patch: setup-go runs with GOTOOLCHAIN=local, so this is the
          # standard library govulncheck judges, and the Dockerfile base image must match.
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -s needed for: $unformatted"
            exit 1
          fi

      - name: Vet, build, test, lint
        # `make test` is unit + envtest; lint is blocking (it used to carry
        # continue-on-error: true).
        run: make vet build test lint

      - name: Vulnerability scan
        # Blocking: reachable vulnerabilities in our code, the modules and the standard library.
        run: make vuln

      - name: Install helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Helm lint
        run: make helm-lint

      - name: Helm template render (CI values)
        run: make helm-template

  image-scan:
    name: Image build + Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, loaded for the scan)
        # Also catches Dockerfile and .dockerignore breakage before anything is published.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: yk-dns-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: yk-dns-manager:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          limit-severities-for-sarif: true

      - name: Upload image findings to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # The report above records everything; only fixable CRITICAL/HIGH fails the build.
      - name: Fail on fixable CRITICAL/HIGH image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: yk-dns-manager:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  fs-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy repository scan (report)
        # Dependencies, Dockerfile and chart misconfigurations, and committed secrets.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          limit-severities-for-sarif: true

      - name: Upload repository findings to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on fixable CRITICAL/HIGH findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
